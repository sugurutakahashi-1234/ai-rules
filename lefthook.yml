# コミットメッセージ検証。このリポジトリは規約（rules/language-and-commits.md）の
# 正本なので、自分自身にも同じ検証を適用する（設定はこのリポの templates/ が正本）。
commit-msg:
  jobs:
    - name: commitlint
      run: bunx commitlint --edit {1}

# 正本 .rulesync/ を直したら CLAUDE.md / AGENTS.md を再生成して同じコミットに含める。
# 生成対象はこのリポジトリ自身の作業指示だけで、配布物の rules/ ・ skills/ は触らない。
pre-commit:
  jobs:
    - name: rulesync-generate
      glob:
        - ".rulesync/**"
        - "rulesync.jsonc"
      run: bunx rulesync generate && git add CLAUDE.md AGENTS.md
